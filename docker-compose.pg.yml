services:
  # 前端服务（仅用于构建，由宿主机 Nginx 提供服务）
  ruoyi-frontend:
    build:
      context: ./ruoyi-fastapi-frontend
      dockerfile: Dockerfile
    image: ruoyi-frontend:latest
    container_name: ruoyi-frontend
    environment:
      TZ: UTC
    ports:
      - "12580:80"
    volumes:
      - ./datas/frontend/dist:/dist
    networks:
      - ruoyi-network

  # 后端服务（PostgreSQL版本）
  ruoyi-backend-pg:
    build:
      context: .
      dockerfile: ruoyi-fastapi-backend/Dockerfile.pg
    image: ruoyi-backend-pg:latest
    container_name: ruoyi-backend-pg
    environment:
      TZ: UTC
    ports:
      - "9099:9099"
    depends_on:
      ruoyi-pg:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    networks:
      - ruoyi-network

  # PostgreSQL服务
  ruoyi-pg:
    image: postgres:latest
    container_name: ruoyi-pg
    environment:
      TZ: UTC
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ruoyi-fastapi
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./datas/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/ruoyi-fastapi-pg.sql
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  ruoyi-redis:
    image: redis:latest
    container_name: ruoyi-redis
    environment:
      TZ: UTC
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  ruoyi-network:
    name: ruoyi-network
    driver: bridge

# 数据卷配置（持久化）
volumes:
  pg_data:
    name: ruoyi-pg-data
  redis_data:
    name: ruoyi-redis-data
